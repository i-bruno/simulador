<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Simulador de crédito UVA</title>
</head>

<body class="bg-neutral-100 flex flex-col content-around items-center">
    <header class="m-1 items-center flex flex-col">
        <h1 class="font-bold">Simulador Precancelación Crédito UVA</h1>
    </header>
    <section class="p-1 m-1 items-center flex flex-col border rounded-sm bg-white w-fit">
        <h2 class="font-bold">Datos</h2>
        <div class="m-1 items-center flex flex-col">
            <label>¿Cuál es el saldo actual (UVA) de mi capital?</label>
            <input id="saldo" class="border rounded-sm text-center">

            <label>¿Cuál es la Tasa anual (%) de mi crédito?</label>
            <input id="tasa" class="border rounded-sm text-center">

            <label>¿De cuantos UVAs es mi cuota?</label>
            <input id="cuota" class="border rounded-sm text-center">

            <label>¿Cuántos UVA quiero pagar?</label>
            <input id="prepago" class="border rounded-sm text-center">

            <button onclick="simular()">Simular</button>
        </div>
        <h3 class="font-bold">Indicadores hoy</h3>

        <div id="indicadores" class="flex flex-row bg-white">
            <div class="m-1 flex flex-col">
                Dólar oficial:
                $<span id="dolar-oficial">cargando...</span>
            </div>
            <div class="m-1 flex flex-col">
                Valor UVA: $<span id="uva"></span>
                <small id="uva-fecha"></small>
            </div>

        </div>
    </section>
    <section class="resultado m-1 items-center flex flex-row w-fit">
        <div id="resultado"></div>
    </section>

    <script src="simulador.js"></script>
</body>

<footer>

</footer>

</html>
