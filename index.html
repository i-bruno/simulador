<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Simulador de crédito UVA</title>
</head>

<body class="bg-neutral-100">
    <header>
        <h1>Simulador Precancelación Crédito UVA</h1>
    </header>
    <section class="usuario">
        <h2>Datos</h2>
        <div class="formulario">
            <label>Saldo actual (UVA)</label>
            <input id="saldo">

            <label>Tasa anual (%)</label>
            <input id="tasa">

            <label>Cuota actual (UVA)</label>
            <input id="cuota">

            <label>Prepago (UVA)</label>
            <input id="prepago">

            <button onclick="simular()">Simular</button>
        </div>
        <h3>Indicadores hoy</h3>

        <div id="indicadores">

            Dólar oficial:
            $<span id="dolar-oficial">cargando...</span>
            <br>

            Valor UVA:
            $<span id="uva">cargando...</span>

        </div>
    </section>
    <section class="resultado">
        <h3>Resultados</h3>
        <div id="resultado"></div>
    </section>

    <script src="simulador.js"></script>
</body>

<footer>

</footer>

</html>
