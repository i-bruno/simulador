<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simulador de crédito UVA</title>
</head>

<body>
    <header>
        <h1>Simulador Precanc. Crédito UVA</h1>
    </header>
    <section class="usuario">
        <h2>Datos</h2>
        <div class="formulario">
            <label>Saldo actual (UVA)</label>
            <input id="saldo">

            <label>Tasa anual (%)</label>
            <input id="tasa">

            <label>Cuota actual (UVA)</label>
            <input id="cuota">

            <label>Prepago (UVA)</label>
            <input id="prepago">

            <button onclick="simular()">Simular</button>
        </div>
    </section>
    <section class="resultado">
        <h3>Resultados</h3>
        <div id="resultado"></div>
    </section>

    <script src="simulador.js"></script>
</body>

<footer>

</footer>

</html>
